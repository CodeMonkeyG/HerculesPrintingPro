version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    container_name: hercules-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend:/var/www
    depends_on:
      - vue-frontend
      - bagisto-backend
    networks:
      - hercules-network

  vue-frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    container_name: hercules-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - hercules-network

  bagisto-backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    container_name: hercules-backend
    volumes:
      - ./backend:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=bagisto
      - DB_USERNAME=hercules
      - DB_PASSWORD=secret
    networks:
      - hercules-network

  postgres:
    image: postgres:15-alpine
    container_name: hercules-postgres
    environment:
      - POSTGRES_DB=bagisto
      - POSTGRES_USER=hercules
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hercules-network

  redis:
    image: redis:alpine
    container_name: hercules-redis
    networks:
      - hercules-network

networks:
  hercules-network:
    driver: bridge

volumes:
  postgres-data:
